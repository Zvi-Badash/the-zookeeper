[project]
name = "the-zookeeper"
version = "0.1.0"
description = "Offline source-code dataset audits"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "python-multipart==0.0.20",
  "numpy==2.2.5", "pyarrow==20.0.0", "duckdb==1.2.2", "faiss-cpu==1.11.0",
  "scikit-learn==1.6.1", "umap-learn==0.5.7", "black==25.1.0", "boto3==1.38.23"
]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1", "moto[s3]==5.1.5"]
gpu = ["cupy-cuda12x==13.6.0", "nvidia-cuda-runtime-cu12==12.6.77", "nvidia-cuda-nvrtc-cu12==12.6.85"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
