name: Release offline GPU image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    # Select an existing version tag in the UI; main is deliberately rejected.
permissions:
  contents: write
jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Free unused hosted-runner SDKs
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - run: bash scripts/prepare.sh
      - name: Build, load and test image; prepare air-gap assets
        run: bash scripts/release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish image archives as GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/upload-release.py "${GITHUB_REF_NAME#v}" --repo "$GITHUB_REPOSITORY" --publish
